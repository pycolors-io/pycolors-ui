<meta name="robots" content="noindex, follow" />
<meta name="application-name" content="PyColors UI Explorer" />
<link rel="icon" type="image/svg+xml" href="./pycolors-mark.svg" />
<style>
  @font-face {
    font-family: "PyColors Geist";
    src: url("./geist-sans.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  /* Scope the lockup to our brand URL rather than Storybook's generated classes. */
  a[href="./?path=/story/foundations-overview--default"]:has(img) {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 44px;
    color: inherit;
    text-decoration: none;
    border-radius: 4px;
  }
  a[href="./?path=/story/foundations-overview--default"]:focus-visible {
    outline: 2px solid var(--pycolors-manager-accent);
    outline-offset: 4px;
  }
  a[href="./?path=/story/foundations-overview--default"] img {
    width: 17px;
    height: 17px;
  }
  a[href="./?path=/story/foundations-overview--default"]:has(img)::after {
    content: "pycolors";
    font-family: "PyColors Geist", sans-serif;
    font-size: 17px;
    font-weight: 600;
    line-height: 20px;
    letter-spacing: -0.025em;
    transform: translateY(-1.25px);
  }
  button.pycolors-resource-trigger {
    gap: 6px;
    min-height: 32px;
    padding-inline: 10px;
    border: 1px solid transparent;
    border-radius: 6px;
    font-family: "PyColors Geist", sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  button.pycolors-resource-trigger:hover,
  button.pycolors-resource-trigger[aria-expanded="true"] {
    border-color: var(--pycolors-manager-border);
    background: var(--pycolors-manager-hover);
    color: var(--pycolors-manager-text);
  }
  button.pycolors-resource-trigger:focus-visible {
    outline: 2px solid var(--pycolors-manager-accent);
    outline-offset: 2px;
  }
  .pycolors-resource-chevron {
    font-size: 12px;
    color: var(--pycolors-manager-muted);
  }
  .pycolors-resource-trigger-compact {
    display: none;
  }
  @media (max-width: 360px) {
    button.pycolors-resource-trigger {
      min-width: 44px;
      padding-inline: 8px;
    }
    .pycolors-resource-trigger-full,
    .pycolors-resource-chevron {
      display: none;
    }
    .pycolors-resource-trigger-compact {
      display: inline;
    }
  }
  @media (pointer: coarse) {
    button.pycolors-resource-trigger {
      min-width: 44px;
      min-height: 44px;
    }
  }
  .pycolors-resource-nav {
    display: grid;
    gap: 2px;
    box-sizing: border-box;
    width: 288px;
    max-width: calc(100vw - 32px);
    max-height: calc(100dvh - 64px);
    overflow: auto;
    padding: 8px;
    font-family: "PyColors Geist", sans-serif;
    font-size: 13px;
    color: var(--pycolors-manager-text);
  }
  .pycolors-resource-heading {
    margin: 4px 12px 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--pycolors-manager-border);
    font-size: 11px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--pycolors-manager-muted);
  }
  .pycolors-resource-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 60px;
    padding: 10px 12px;
    border-radius: 6px;
    color: inherit;
    text-decoration: none;
  }
  .pycolors-resource-link:hover,
  .pycolors-resource-link:focus-visible {
    background: var(--pycolors-manager-hover);
  }
  .pycolors-resource-link:focus-visible {
    outline: 2px solid var(--pycolors-manager-accent);
    outline-offset: -2px;
  }
  .pycolors-resource-copy {
    display: grid;
    gap: 4px;
    min-width: 0;
  }
  .pycolors-resource-label {
    font-weight: 550;
    line-height: 1.4;
  }
  .pycolors-resource-description {
    font-size: 12px;
    line-height: 1.55;
    color: var(--pycolors-manager-muted);
  }
  .pycolors-resource-arrow {
    flex-shrink: 0;
    font-size: 14px;
    color: var(--pycolors-manager-muted);
  }
  .pycolors-sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  @media (forced-colors: active) {
    a[href="./?path=/story/foundations-overview--default"]:focus-visible,
    button.pycolors-resource-trigger:focus-visible,
    .pycolors-resource-link:focus-visible {
      outline-color: Highlight;
    }
    button.pycolors-resource-trigger[aria-expanded="true"] {
      border-color: ButtonText;
    }
    .pycolors-resource-description,
    .pycolors-resource-heading,
    .pycolors-resource-arrow,
    .pycolors-resource-chevron {
      color: inherit;
    }
  }
</style>
