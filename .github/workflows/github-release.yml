name: Release (@pycolors/ui)

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "CHANGELOG.md"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-ui
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Zero substitution shell, écrit directement dans GITHUB_OUTPUT via Node
      - name: Read version
        id: v
        run: |
          node -e "const fs=require('fs'); const v=require('./package.json').version; fs.appendFileSync(process.env.GITHUB_OUTPUT, `VERSION=${v}\n`); console.log('Detected version:', v);"

      - name: Extract release notes from CHANGELOG
        run: |
          set -e
          VERSION="${{ steps.v.outputs.VERSION }}"

          awk "/^##[[:space:]]+${VERSION}[[:space:]]*$/{flag=1;next} /^##[[:space:]]+/{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${VERSION}" > RELEASE_NOTES.md
          fi

          echo "---- RELEASE NOTES ----"
          cat RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ steps.v.outputs.VERSION }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
            echo "✅ Updated release $TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
            echo "✅ Created release $TAG"
          fi
