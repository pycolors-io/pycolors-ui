name: Release (@pycolors/ui)

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "CHANGELOG.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ################################################
      # Get version
      ################################################
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      ################################################
      # Extract changelog section
      ################################################
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract lines after "## <VERSION>" until next "## "
          awk "/^##[[:space:]]+${VERSION}\$/{flag=1;next} /^##[[:space:]]+/{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section found for ${VERSION} — using fallback."
            printf "Release %s\n" "$VERSION" > RELEASE_NOTES.md
          fi

          echo "---- RELEASE NOTES ----"
          cat RELEASE_NOTES.md
          echo "-----------------------"

      ################################################
      # Create GitHub Release (creates tag if missing)
      ################################################
      - name: Create GitHub Release (skip if exists)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --target "${GITHUB_SHA}"
